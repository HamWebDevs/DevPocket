[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devpocket-toolkit"
version = "1.2.0"
description = "Extensible local developer diagnostics: plugins, parallel checks, SARIF and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HamWebDevs"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/HamWebDevs/DevPocket"
Repository = "https://github.com/HamWebDevs/DevPocket"
Issues = "https://github.com/HamWebDevs/DevPocket/issues"
Changelog = "https://github.com/HamWebDevs/DevPocket/blob/main/CHANGELOG.md"

[project.scripts]
devpocket = "devpocket.cli:main"
oopsfile = "devpocket.cli:oops_main"
envtwin = "devpocket.cli:env_main"
undorun = "devpocket.cli:undo_main"
flaketrail = "devpocket.cli:flake_main"
reporadar = "devpocket.cli:radar_main"
loglens = "devpocket.cli:log_main"
importdoctor = "devpocket.cli:import_main"
assetguard = "devpocket.cli:asset_main"
workspace-plan = "devpocket.cli:workspace_plan_main"
config-validate = "devpocket.cli:config_validate_main"
envguard = "devpocket.cli:envguard_main"
testlens = "devpocket.cli:testlens_main"

[tool.setuptools.packages.find]
include = ["devpocket*"]

[tool.setuptools.package-data]
devpocket = ["schemas/*.json"]
