name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade setuptools wheel
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: devpocket --help
      - run: config-validate --root . --format json
      - run: devpocket config validate --root examples/workspace --workspace --format json
      - run: devpocket config schema --kind project
      - run: loglens examples/events.log --json
      - run: importdoctor json --json
      - run: assetguard --root examples/web-dist --max-total-gzip-kib 16
      - run: devpocket check --config examples/web-checks.json --format json
      - run: workspace-plan --root examples/workspace --format json
      - run: devpocket workspace check --root examples/workspace --format sarif --output workspace.sarif
      - run: python -m devpocket reporadar --root .
      - run: devpocket check --format json
      - run: python examples/verify_extension.py --no-build-isolation
        if: matrix.python == '3.12'
      - run: devpocket check --format sarif --output checks.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ runner.os }}-${{ matrix.python }}
          path: |
            checks.sarif
            workspace.sarif
  action-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: passing
        with:
          config: examples/web-checks.json
      - uses: ./
        id: failing
        continue-on-error: true
        with:
          config: examples/action-failure.json
      - uses: ./
        id: workspace
        with:
          root: examples/workspace
          mode: workspace
      - run: python examples/verify_action.py
        env:
          PASS_REPORT: ${{ steps.passing.outputs.report }}
          PASS_SARIF: ${{ steps.passing.outputs.sarif }}
          FAIL_REPORT: ${{ steps.failing.outputs.report }}
          FAIL_SARIF: ${{ steps.failing.outputs.sarif }}
          FAIL_OUTCOME: ${{ steps.failing.outcome }}
          FAIL_EXIT: ${{ steps.failing.outputs.exit-code }}
          WORKSPACE_REPORT: ${{ steps.workspace.outputs.report }}
          WORKSPACE_SARIF: ${{ steps.workspace.outputs.sarif }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-reports-${{ runner.os }}
          path: |
            ${{ steps.passing.outputs.directory }}
            ${{ steps.failing.outputs.directory }}
            ${{ steps.workspace.outputs.directory }}
