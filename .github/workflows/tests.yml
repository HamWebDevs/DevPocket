name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade setuptools wheel
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: devpocket --help
      - run: loglens examples/events.log --json
      - run: importdoctor json --json
      - run: assetguard --root examples/web-dist --max-total-gzip-kib 16
      - run: devpocket check --config examples/web-checks.json --format json
      - run: python -m devpocket reporadar --root .
      - run: devpocket check --format json
      - run: python examples/verify_extension.py --no-build-isolation
        if: matrix.python == '3.12'
      - run: devpocket check --format sarif --output checks.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ runner.os }}-${{ matrix.python }}
          path: checks.sarif
