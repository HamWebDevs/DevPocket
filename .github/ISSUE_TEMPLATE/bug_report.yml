name: Bug report
description: Report a reproducible problem with a DevPocket command.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Please remove secrets and private data from commands, reports and logs before sharing.
  - type: dropdown
    id: tool
    attributes:
      label: Affected tool
      options: [Oopsfile, EnvTwin, UndoRun, FlakeTrail, RepoRadar, LogLens, ImportDoctor, Installation or CLI]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command and a small artificial fixture if possible.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version and DevPocket version.
    validations:
      required: true
